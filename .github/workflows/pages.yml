name: Deploy blog to GitHub Pages

# Publishes the static site in docs/ to GitHub Pages.
#
# NOTE: this needs GitHub Actions, which is blocked while the account has a
# billing lock. Until that is resolved, publish with the classic path instead:
#   Settings -> Pages -> Source: Deploy from a branch -> main -> /docs
# That route does not use Actions minutes. This workflow is left as manual-only
# (workflow_dispatch) so it does not fail on every push; run it from the Actions
# tab once billing is sorted.

on:
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Configure Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true
      - name: Upload site
        uses: actions/upload-pages-artifact@v3
        with:
          path: docs
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
